name: Build Android
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Built-in server URL
        required: true
        type: string
        default: "https://tv.emoxw.cn"
env:
  FLUTTER_VERSION: "3.44.8"
  RUST_VERSION: "1.97.1"
jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up build toolchain
        uses: ./.github/actions/setup-build
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          rust-version: ${{ env.RUST_VERSION }}
          rust-targets: aarch64-linux-android
      - name: Build Android APK
        run: |
          flutter build apk --release --no-pub \
            --target-platform android-arm64 \
            --dart-define SYNCTV_BUILT_IN_SERVER_URL="${{ github.event.inputs.server_url }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncTV-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
